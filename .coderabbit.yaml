# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: en-US
early_access: false

reviews:
  profile: "chill"
  high_level_summary: false
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true

  path_filters:
    - "!vendor/**"
    - "!**/vendor/**"
    - "!**/zz_generated*"
    - "!go.sum"
    # Generated OLM bundle output of `make bundle`
    - "!bundle/**"
    # Per-release OLM bundles; the cma.v* CSVs are generated by
    # hack/cma-generate-csv.sh and verified by `make cma-check-all-csv`
    - "!keda/**"
    - "!http-add-on/**"
    # Operand release manifests imported verbatim from upstream releases
    - "!resources/keda.yaml"
    - "!resources/keda-http-addon.yaml"
    # Generated CRDs and RBAC
    - "!config/crd/bases/**"
    - "!config/rbac/role.yaml"
    # Upstream-maintained; our CI is OpenShift CI (Prow), not GitHub Actions
    - "!.github/**"
    - "!images/**"

  path_instructions:
    - path: "api/**/*.go"
      instructions: |
        These are the KedaController CRD types, the only API this operator
        owns. Review for backward compatibility above all else: removing a
        field, renaming a JSON tag, tightening validation, or changing a
        default breaks existing installations and cannot be undone. Check
        that kubebuilder validation markers are correct, that optional
        fields have omitempty and required fields do not, and that any
        change is accompanied by regenerated deepcopy (make generate) and
        CRDs (make manifests). Flag API changes as needing human review.

    - path: "internal/controller/keda/*.go"
      instructions: |
        These reconcilers install and configure the KEDA operands. Review for
        idempotent reconciliation, correct status subresource updates rather
        than full object updates, and safe cleanup on deletion via the
        finalizer. Note that the KedaController reconciler, the ConfigMap
        controller, the Secret controller, and a background goroutine all
        write to the same KedaController status, so watch for races and
        conflicting updates. Only a CR named "keda" in the operator's
        namespace is acted upon. OpenShift-specific behavior must stay
        gated behind util.RunningOnOpenshift so the operator still works on
        plain Kubernetes.

    - path: "internal/controller/keda/transform/**/*.go"
      instructions: |
        This is the manifestival transformer library that mutates the
        embedded operand manifests in memory according to the KedaController
        spec. Review for correct nil and empty-value handling: a transformer
        that fires on an unset field will silently change the operand
        configuration for every user. Verify transformers are idempotent,
        target the intended container or resource by name rather than by
        index, and never write into a Deployment's selector matchLabels,
        which is immutable and has broken OLM upgrades before. New
        transformers should come with unit tests.

    - path: "internal/controller/keda/util/**/*.go"
      instructions: |
        Shared helpers for OpenShift detection, CRD discovery, checksums,
        and TLS security profile translation. Review TLS cipher and minimum
        version conversion carefully; these values are passed to the operand
        and a mistake weakens transport security cluster-wide.

    - path: "resources/*.go"
      instructions: |
        This loads the operand manifests. The YAML files alongside it are
        imported verbatim from upstream operand releases and must not be
        hand-edited. Note that the loader resolves paths with
        runtime.Caller(0), so the manifests are read from disk at their
        compile-time source path rather than embedded with go:embed. Any
        change to how those paths are resolved, or to the directory layout,
        must be matched in both Dockerfile and Dockerfile.ci, which stage
        the YAML at that exact path.

    - path: "config/manifests/bases/*.clusterserviceversion.yaml"
      instructions: |
        The hand-maintained CSV base. Changes here flow into the generated
        bundle and govern how OLM installs and upgrades the operator. Review
        install modes, the replaces field, RBAC permissions, relatedImages,
        and any Deployment selector labels with extra care, and consider
        whether hack/cma-generate-csv.sh needs the equivalent change for the
        CMA-branded CSV that actually ships.

    - path: "config/**/*.yaml"
      instructions: |
        Kustomize sources for CRDs, RBAC, and the operator Deployment. Note
        that config/crd/bases and config/rbac/role.yaml are generated. For
        everything else check securityContext, resource requests and limits,
        and RBAC least privilege. Be aware that `make bundle` and
        `make deploy` rewrite config/manager/kustomization.yaml and
        config/default/kustomization.yaml as a side effect, so flag churn in
        those two files that looks accidental.

    - path: "hack/**/*.sh"
      instructions: |
        These scripts run in CI and during releases. Check for `set -e`
        style error handling, correct quoting, and shellcheck compliance.
        cma-verify-history.sh validates the UPSTREAM: commit prefix
        convention; cma-generate-csv.sh produces the CSV that ships to
        customers, so changes to its jq transformations are high risk and
        require regenerating every affected cma.v* CSV.

    - path: "test/e2e/**/*.go"
      instructions: |
        E2E tests run against a live cluster with the operator installed via
        OLM, behind the `e2e` build tag. Review for deterministic test
        names, proper resource cleanup, realistic timeouts, and no
        assumptions about leftover state from earlier tests. The upgrade
        tests are split into a pre step and a post step that must remain
        consistent with each other.

    - path: "**/*_test.go"
      instructions: |
        Verify tests are table-driven where appropriate, have deterministic
        names, and clean up after themselves. This repo uses Ginkgo v1 and
        Gomega. Note the custom -test.type flag (unit, functionality,
        deployment) that selects which suites run.

    - path: "**/{Dockerfile,Dockerfile.*,bundle.Dockerfile,bundle*.Dockerfile.ci}"
      instructions: |
        Check for multi-stage builds, no secrets or credentials, and minimal
        final images. Dockerfile.ci is downstream-only and intentionally
        vendors extra tool sources for OSBS/Cachito compliance, patches the
        PodMonitor name, and symlinks /resources to the builder's source
        path; do not suggest removing those steps. The operator resolves the
        operand manifests by their compile-time path, so the staged location
        of resources/*.yaml and the builder WORKDIR are load-bearing and
        must stay consistent between the two Dockerfiles. Remember
        that these Dockerfiles serve OpenShift CI, while Konflux
        (openshift/custom-metrics-autoscaler-pipelines) builds the shipped
        release artifacts. bundle-previous.Dockerfile.ci must keep selecting
        the second-newest keda/<version> directory for the upgrade e2e job
        to have a valid upgrade edge.

    - path: "must-gather/**"
      instructions: |
        Support data collection scripts that run on customer clusters.
        Review for shell robustness and, most importantly, that no secrets,
        credentials, or token values are collected into the output.

    - path: "**/*.md"
      instructions: |
        Check that referenced file paths, make targets, and links actually
        exist in this repo. Note that the linter target is `make golangci`
        (there is no `make lint` or `make verify`).

  tools:
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true

# knowledge_base is a top-level key, not a child of `reviews`.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CONTRIBUTING_OPENSHIFT.md"
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
